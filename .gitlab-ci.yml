stages:
  - validate
  - build
  - test

variables:
  DOCKER_COMPOSE_FILE: docker-compose.yml
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

validate:garbage-check:
  stage: validate
  image: alpine:latest
  script:
    - |
      GARBAGE=(
        "Dockerfile.grafana"
        "prometheus/"
        "postgres/config/postgres_exporter.yml"
        "postgres/config/queries.yml"
        "events.csv"
        "CLEANUP_REPORT.md"
        ".bandit"
        ".github/"
      )
      for item in "${GARBAGE[@]}"; do
        if [ -e "$item" ]; then
          echo "ERROR: Garbage detected: $item"
          exit 1
        fi
      done
      echo "OK: No garbage detected"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_MERGE_REQUEST_IID

validate:architecture-rules:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install -q pyyaml
    - python scripts/ci_validate.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_MERGE_REQUEST_IID

validate:docker-compose-compliance:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install -q pyyaml
    - python scripts/ci_validate_compose.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_MERGE_REQUEST_IID

build:docker-images:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker compose config -q
    - docker compose build --parallel
    - |
      if grep -E "wget|curl|git clone" Dockerfile.processor | grep -v "COPY.*model" | grep -v "FROM"; then
        echo "ERROR: Runtime model download detected in Dockerfile.processor"
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_MERGE_REQUEST_IID

test:unit-and-integration:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -q -r requirements-dev.txt
    - pytest core/tests/ parser/tests/ processor/tests/ -v
    - |
      if [ ! -f "processor/tests/test_text_preprocessor.py" ] && [ ! -f "parser/tests/test_text_preprocessor.py" ]; then
        echo "ERROR: text_preprocessor tests missing (R-P23)"
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_MERGE_REQUEST_IID
