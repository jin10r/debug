# Docker Compose - Survival Map v3
# Architecture: Parser (kurigram) → Processor (NLP) → PostgreSQL → Core (API)

# Shared logging config — json-file с ротацией (max 50MB на сервис: 5×10MB).
# Без этого docker накапливает логи без ограничений и съедает диск.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # =============================================================================
  # PostgreSQL - основной storage с PostGIS
  # =============================================================================
  postgres:
    image: survival_postgres:latest
    build:
      context: .
      dockerfile: Dockerfile.postgres
      network: host
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Role-specific timeouts
      PARSER_STATEMENT_TIMEOUT: 60000
      CORE_STATEMENT_TIMEOUT: 30000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && psql -U postgres -d postgres -c 'SELECT pg_is_in_recovery()' | grep -q 'f' && psql -U postgres -d postgres -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Parser - Telegram клиент (kurigram) + предобработка текста + фото
  # =============================================================================
  parser:
    image: survival_parser:latest
    build:
      context: .
      dockerfile: Dockerfile.parser
      network: host
    container_name: parser
    stop_grace_period: 60s
    environment:
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_PORT: ${PROXY_PORT:-1080}
      PROXY_SCHEME: ${PROXY_SCHEME:-socks5}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    dns:
      - 9.9.9.9
      - 1.1.1.1
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./parser/session.session:/app/parser/session.session:rw
      - events_media:/media/events:rw
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - db
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/parser_heartbeat && [ $$(( $$(date +%s) - $$(cat /tmp/parser_heartbeat) )) -lt 60 ]"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Processor - NLP pipeline (pymorphy3 + rapidfuzz + PostGIS)
  # =============================================================================
  processor:
    image: survival_processor:latest
    build:
      context: .
      dockerfile: Dockerfile.processor
      network: host
    container_name: processor
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      NOMINATIM_ENABLED: ${NOMINATIM_ENABLED:-true}
    dns:
      - 9.9.9.9
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      # Ждём healthcheck nominatim (HTTP API на 8080), а не просто старта контейнера:
      # иначе processor стартует во время PBF-импорта, NominatimClient.connect()
      # упадёт, и Nominatim fallback будет навсегда отключён для данной сессии.
      nominatim:
        condition: service_healthy
    networks:
      - backend
      - db
    healthcheck:
      # Свежесть heartbeat-файла: processor обновляет его каждую секунду.
      # start_period 120s: PhoneticIndex build из ~1000 alias-фраз + PG connect.
      test: ["CMD-SHELL", "test -f /tmp/processor_heartbeat && [ $$(( $$(date +%s) - $$(cat /tmp/processor_heartbeat) )) -lt 60 ]"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          # Память: DAWG pymorphy3 (~20MB) + LRU-кэши + ProcessPoolExecutor
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Core - API сервер (опционально)
  # =============================================================================
  core:
    image: survival_core:latest
    build:
      context: .
      dockerfile: Dockerfile.core
      network: host
    container_name: core
    stop_grace_period: 30s
    environment:
      # Только credentials/per-deployment URL — всё остальное в core/settings.py.
      # JWT_SECRET не передаём — он автогенерируется в core/settings.py.
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL:-}
      REDIRECT_URL: ${REDIRECT_URL:-}
      # Optional override: dev-режим без валидации Telegram InitData (default True).
      TELEGRAM_VALIDATION_ENABLED: ${TELEGRAM_VALIDATION_ENABLED:-True}
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_PORT: ${PROXY_PORT:-1080}
      PROXY_SCHEME: ${PROXY_SCHEME:-socks5}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    dns:
      - 9.9.9.9
      - 1.1.1.1
    volumes:
      - events_media:/media/events:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - db
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Web - reverse proxy + статика фронтенда
  # =============================================================================
  web:
    image: survival_web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
      network: host
    container_name: web
    stop_grace_period: 30s
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - events_media:/media/events:ro
    depends_on:
      core:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NET_BIND_SERVICE — для bind на 80, остальные drop'нуты.
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Nominatim - геокодер (ODbL OSM data)
  # =============================================================================
  nominatim:
    build:
      context: .
      dockerfile: Dockerfile.nominatim
      network: host
    container_name: nominatim
    shm_size: 1gb
    environment:
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-qaIACxO6wMR3}
      NOMINATIM_QUERY_TIMEOUT: 10
      WARMUP_ON_STARTUP: "false"
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_MAINTENANCE_WORK_MEM: 512MB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_MAX_WAL_SIZE: 512MB
    volumes:
      - ./data:/nominatim/data
      - nominatim_data:/var/lib/postgresql/16/main
    networks:
      - backend
      - db
    expose:
      - "5432"
    healthcheck:
      # PBF import занимает 5–15 минут для Odesa Oblast (35MB).
      # start_period 1200s = 20 min: Docker не считает failures во время импорта.
      # После импорта gunicorn стартует на 8080 → healthcheck проходит.
      test: ["CMD", "curl", "-sf", "http://localhost:8080/status"]
      interval: 15s
      timeout: 5s
      start_period: 1200s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Networks
  # =============================================================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  db:
    driver: bridge
    internal: true  # No external access

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  events_media:
    driver: local
  nominatim_data:
    driver: local
  # model_models — удалён, заменён на внешний ollama
