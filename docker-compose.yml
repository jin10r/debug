# Docker Compose - Survival Map v2
# Architecture: Parser with SQLite replica + PostgreSQL with PostGIS

# Shared logging config — json-file с ротацией (max 50MB на сервис: 5×10MB).
# Без этого docker накапливает логи без ограничений и съедает диск.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # =============================================================================
  # PostgreSQL - основной storage с PostGIS
  # =============================================================================
  postgres:
    image: survival_postgres:latest
    build:
      context: .
      dockerfile: Dockerfile.postgres
      network: host
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && psql -U postgres -d postgres -c 'SELECT pg_is_in_recovery()' | grep -q 'f' && psql -U postgres -d postgres -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Parser - Telegram парсер с in-memory кэшем
  # =============================================================================
  parser:
    image: survival_parser:latest
    build:
      context: .
      dockerfile: Dockerfile.parser
      network: host
    container_name: parser
    environment:
      # PostgreSQL connection
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Telegram
      CHANNEL_ID: ${CHANNEL_ID}
      # JWT Secret (required for settings validation)
      JWT_SECRET: ${JWT_SECRET}
      # Media
      EVENTS_MEDIA_DIR: /media/events
      # StreetMatcher tuning (см. core/settings.py.SimilarityConfig)
      ENTITY_SIMILARITY_THRESHOLD: ${ENTITY_SIMILARITY_THRESHOLD:-0.75}
      PSEUDO_INTERSECTION_RADIUS_METERS: ${PSEUDO_INTERSECTION_RADIUS_METERS:-150}
      # Logging — json для агрегации, text для локального чтения логов
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Telegram proxy (optional, for blocked networks)
      SOCKS5_HOST: ${SOCKS5_HOST:-}
      PROXY_PORT: ${PROXY_PORT:-1080}
      PROXY_SCHEME: ${PROXY_SCHEME:-socks5}
    volumes:
      - ./parser/session.session:/app/parser/session.session:rw
      - events_media:/media/events:rw
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - db
    healthcheck:
      # Свежесть heartbeat-файла: parser обновляет его каждую секунду в
      # keep-alive цикле. Stale-файл = event loop завис → unhealthy.
      # start_period 180s: NER (natasha) + Navec embeddings (~50 MB) loading
      # + SymSpell dictionary build из ~1000 alias-фраз. 120s было мало.
      test: ["CMD-SHELL", "test -f /tmp/parser_heartbeat && [ $$(( $$(date +%s) - $$(cat /tmp/parser_heartbeat) )) -lt 60 ]"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Redis - кэш и очереди (опционально)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - backend
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # App - API сервер (опционально)
  # =============================================================================
  app:
    image: survival_app:latest
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: app
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      # Bot
      BOT_TOKEN: ${BOT_TOKEN}
      CHANNEL_ID: ${CHANNEL_ID}
      # App
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      # Безопасный дефолт: валидация Telegram включена, если явно не отключена
      # в .env. Dev-режим (валидация off) включается осознанно.
      APP_TELEGRAM_VALIDATION: ${TELEGRAM_VALIDATION_ENABLED:-True}
      # Optional
      WEBAPP_URL: ${WEBAPP_URL:-}
      REDIRECT_URL: ${REDIRECT_URL:-}
      # CORS — пустое значение или '*' = CORS выключен (same-origin only).
      # Только перечисленные через запятую origins включают CORS.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # StreetMatcher tuning (загружается в settings.similarity, доступен app тоже)
      ENTITY_SIMILARITY_THRESHOLD: ${ENTITY_SIMILARITY_THRESHOLD:-0.75}
      PSEUDO_INTERSECTION_RADIUS_METERS: ${PSEUDO_INTERSECTION_RADIUS_METERS:-150}
      # Logging — json для агрегации, text для локального чтения
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Media
      EVENTS_MEDIA_DIR: /media/events
    volumes:
      - events_media:/media/events:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - db
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Nginx - reverse proxy
  # =============================================================================
  nginx:
    image: survival_nginx:latest
    build:
      context: .
      dockerfile: Dockerfile.nginx
      network: host
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - events_media:/media/events:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped
    logging: *default-logging

# =============================================================================
# Networks
# =============================================================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  db:
    driver: bridge
    internal: true  # No external access

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  events_media:
    driver: local
  redis_data:
    driver: local
