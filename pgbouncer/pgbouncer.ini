; =============================================================================
; PgBouncer configuration for Survival Map
; =============================================================================
; Connection pooling between application services and PostgreSQL.
; App services connect to PgBouncer (6432); PgBouncer multiplexes them onto
; PostgreSQL (5432) with at most max_db_connections=20 backends.

[databases]
; Route all connections to the PostgreSQL container
postgres = host=postgres port=5432 dbname=postgres

[pgbouncer]
; ---------------------------------------------------------------------------
; Connection pool settings
; ---------------------------------------------------------------------------
; Pool mode: transaction releases connection after each transaction (best for
; asyncpg which uses short-lived transactions). 'session' would hold connections
; for the entire client session (wastes pool capacity).
pool_mode = transaction

; Minimum connections to keep alive in the pool (avoids cold-start latency)
min_pool_size = 5

; Maximum connections per pool (to PostgreSQL backend)
default_pool_size = 20

; Maximum total connections across all pools
max_client_conn = 200

; Maximum connections per database/user pair (hard limit).
; Aligned with postgresql.conf max_connections=20 so PgBouncer never exhausts
; PostgreSQL's connection budget (default_pool_size=20 already caps the pool).
max_db_connections = 20

; ---------------------------------------------------------------------------
; Timeouts
; ---------------------------------------------------------------------------
; Server connection idle timeout (seconds) — close idle backends to save memory
server_idle_timeout = 300

; Server login timeout (seconds)
server_login_retry = 3

; Client login timeout (seconds) — kick clients that don't authenticate quickly
client_login_timeout = 60

; Query timeout (seconds) — kill queries running longer than this
query_timeout = 120

; ---------------------------------------------------------------------------
; Logging & admin
; ---------------------------------------------------------------------------
admin_users = postgres
stats_users = postgres

; Log pooler errors (not every connection)
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; ---------------------------------------------------------------------------
; Security
; ---------------------------------------------------------------------------
; Disable dangerous commands via admin console
ignore_startup_parameters = extra_float_digits

; ---------------------------------------------------------------------------
; Performance
; ---------------------------------------------------------------------------
; TCP keepalive to detect dead connections
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
