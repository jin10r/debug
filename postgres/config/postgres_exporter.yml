# postgres_exporter.yml — минимальный пустой конфиг.
# Все настройки задаются через env: DATA_SOURCE_NAME (подключение) и
# PG_EXPORTER_EXTEND_QUERY_PATH (кастомные SQL-метрики из queries.yml).
# Файл существует, чтобы экспортер не логировал warn об отсутствующем
# конфиге при старте (пустой YAML парсер считает EOF-ошибкой, поэтому `{}`).
auth_modules: {}
