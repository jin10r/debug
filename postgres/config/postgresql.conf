# PostgreSQL Configuration — Optimized for Survival Map
# Phase 1: Resource & Connection Tuning
# Phase 2: Query Performance
# Phase 4: Monitoring & Logging

# Required libraries
shared_preload_libraries = 'pg_cron,pg_stat_statements'

# Network
listen_addresses = '*'
port = 5432
# max_connections: PgBouncer is the only client of PostgreSQL now.
# PgBouncer default_pool_size=20 + max_db_connections=20 → 20 backends max.
# Kept at 20 (no extra margin needed: admin/monitoring connect via profiles
# and the bitnami pgbouncer admin uses the same pool).
max_connections = 20

# Memory — tuned for 1GB container limit
# shared_buffers: 25% of RAM (256MB/1GB) — postgres recommendation
# effective_cache_size: 75% of RAM (768MB/1GB) — tells planner about OS cache
shared_buffers = 256MB
effective_cache_size = 768MB
# work_mem: per-sort/hash operation. With PgBouncer (max 25 backends),
# each backend can use up to work_mem × active_operations. Keep conservative.
work_mem = 8MB
# maintenance_work_mem: VACUUM, CREATE INDEX, ALTER TABLE. Higher = faster maintenance.
maintenance_work_mem = 128MB
huge_pages = off

# Query planning
# random_page_cost: SSD-optimized (1.1 vs HDD default 4.0)
random_page_cost = 1.1
# effective_io_concurrency: SSD can handle many concurrent reads
effective_io_concurrency = 200
# default_statistics_target: higher = more accurate plans for PostGIS queries
default_statistics_target = 500

# Parallel queries — for PostGIS CTE scans
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
parallel_tuple_cost = 0.01
parallel_setup_cost = 100

# WAL — tuned for high-churn events (60-min TTL, frequent INSERTs)
wal_level = replica
# max_wal_size: allows longer checkpoint intervals under heavy write load
max_wal_size = 1GB
min_wal_size = 256MB
# wal_buffers: 1/32 of shared_buffers (256MB/32 = 8MB), min 64KB
wal_buffers = 8MB
wal_compression = zstd

# Checkpoint tuning — spread I/O over longer interval
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
# max_wal_senders: 0 = no replication (single-node deployment)
max_wal_senders = 0

# JIT — for complex PostGIS CTE queries (process_candidates_v2)
jit = on
jit_above_cost = 100000

# Autovacuum — aggressive for 60-min TTL events table
autovacuum = on
autovacuum_naptime = 15s
# vacuum_scale_factor: trigger vacuum after 5% of table changed (default 20%)
autovacuum_vacuum_scale_factor = 0.05
# analyze_scale_factor: trigger analyze after 2% changed (default 10%)
autovacuum_analyze_scale_factor = 0.02
# vacuum_threshold: minimum dead tuples before vacuum starts
autovacuum_vacuum_threshold = 500
autovacuum_analyze_threshold = 250
# vacuum_cost_delay: 2ms (default 20ms) — more aggressive cleanup
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000
autovacuum_max_workers = 4
autovacuum_freeze_max_age = 500000000

# Table-specific autovacuum for events (high-churn)
# Set via ALTER TABLE in migration script

# Logging — errors + slow queries
log_min_messages = warning
log_line_prefix = '%m [%p] %u@%d '
log_statement = 'none'
log_min_duration_statement = 500
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1000

# Roles with custom timeouts — set via ALTER ROLE in migration
# parser: 60s (complex PostGIS queries)
# core: 30s (simple lookups)
# maintenance: 300s (batch operations)

# Statement timeout — safety net (overridden per-role)
statement_timeout = '60s'
lock_timeout = '30s'
idle_in_transaction_session_timeout = '5min'

# pg_stat_statements — query monitoring
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.save = on
pg_stat_statements.track_utility = off

# pg_cron
cron.database_name = 'postgres'

# Timezone
timezone = 'UTC'

# SSL — off in Docker internal network
ssl = off
