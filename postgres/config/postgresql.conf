# PostgreSQL Configuration

# Required libraries (must match Dockerfile CMD if overridden)
shared_preload_libraries = 'pg_cron'

# Network
listen_addresses = '*'
port = 5432
max_connections = 100

# Logging - errors only
log_min_messages = warning
log_line_prefix = '%m [%p] '
log_statement = 'none'

# Memory
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB

# Timezone
timezone = 'UTC'
