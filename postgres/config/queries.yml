# Queries for postgres_exporter (Phase 4: Monitoring)
# Дополнительные метрики для Prometheus

pg_stat_activity:
  query: |
    SELECT
      datname,
      state,
      COUNT(*) AS count
    FROM pg_stat_activity
    WHERE pid <> pg_backend_pid()
    GROUP BY datname, state;
  metrics:
    - datname:
        usage: LABEL
    - state:
        usage: LABEL
    - count:
        usage: GAUGE

pg_stat_statements_top:
  query: |
    SELECT
      queryid,
      LEFT(query, 200) AS query,
      calls,
      total_exec_time / 1000 AS total_sec,
      mean_exec_time AS mean_ms,
      rows,
      shared_blks_hit,
      shared_blks_read
    FROM pg_stat_statements
    ORDER BY total_exec_time DESC
    LIMIT 20;
  metrics:
    - queryid:
        usage: LABEL
    - query:
        usage: LABEL
    - calls:
        usage: COUNTER
    - total_sec:
        usage: COUNTER
    - mean_ms:
        usage: GAUGE
    - rows:
        usage: COUNTER
    - shared_blks_hit:
        usage: COUNTER
    - shared_blks_read:
        usage: COUNTER

pg_bloat:
  query: |
    SELECT
      schemaname,
      tablename,
      ROUND(CAST(
        (CASE WHEN otta IS NULL THEN 0 ELSE pg_relation_size(c.relid) - otta * COALESCE(pg_table_size(c.relid) - pg_relation_size(c.relid), 0) END)
        / 1024 / 1024 AS numeric), 2) AS bloat_mb
    FROM (
      SELECT
        schemaname,
        tablename,
        cc.relid,
        COALESCE(cc.relpages, 0) * 8192 AS actual_size
      FROM pg_catalog.pg_class cc
      JOIN pg_catalog.pg_namespace nn ON cc.relnamespace = nn.oid
      WHERE nn.nspname = 'public'
    ) c;
  metrics:
    - schemaname:
        usage: LABEL
    - tablename:
        usage: LABEL
    - bloat_mb:
        usage: GAUGE

pg_replication_lag:
  query: |
    SELECT
      CASE WHEN pg_is_in_recovery() THEN 1 ELSE 0 END AS in_recovery,
      EXTRACT(epoch FROM NOW() - pg_last_xact_replay_timestamp()) AS replay_lag_sec
    WHERE pg_is_in_recovery();
  metrics:
    - in_recovery:
        usage: GAUGE
    - replay_lag_sec:
        usage: GAUGE
