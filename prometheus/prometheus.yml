# Prometheus — сбор метрик приложения (core) и PostgreSQL (postgres-exporter).
# Запускается docker-compose сервисом `prometheus`, данные живут в volume prometheus_data.
global:
  scrape_interval: 15s      # Как часто опрашиваем таргеты
  evaluation_interval: 15s  # Как часто считаем правила/алармы
  external_labels:
    monitor: survival_map

# Ретеншн хранилища задаётся флагом --storage.tsdb.retention.time в docker-compose
# (в конфиг-файле Prometheus опции storage нет).

scrape_configs:
  # Метрики приложения: core отдаёт /metrics на 8080 (core/utils/metrics.py).
  # Доступен напрямую в сети backend (минуя nginx/лимиты).
  - job_name: 'core'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['core:8080']

  # Метрики PostgreSQL: postgres-exporter слушает 9187 в сети db.
  # Кастомные SQL-запросы — из postgres/config/queries.yml.
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Метрики NLP-процессора: /metrics на health-сервере (8765, processor/metrics.py).
  # semantic_checked/accepted/rejected + geo_matches_total{source}.
  - job_name: 'processor'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['processor:8765']
