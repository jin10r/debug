<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Telegram WebView Flow</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .step {
            background: #2a2a2a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #0088cc;
        }
        .success { border-left-color: #4ade80; }
        .error { border-left-color: #ef4444; }
        .warning { border-left-color: #fbbf24; }
        
        button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0077aa; }
        
        pre {
            background: #333;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        
        .debug-info {
            background: #1a1f2e;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🔍 Тест Telegram WebView Authentication Flow</h1>
    
    <div class="step">
        <h2>Step 1: Environment Check</h2>
        <div id="env-check"></div>
    </div>

    <div class="step">
        <h2>Step 2: Config Loading</h2>
        <button onclick="testConfigLoad()">Test Config Load</button>
        <div id="config-result"></div>
    </div>

    <div class="step">
        <h2>Step 3: InitData Test</h2>
        <button onclick="testInitData()">Test InitData Extraction</button>
        <div id="initdata-result"></div>
    </div>

    <div class="step">
        <h2>Step 4: Backend Validation</h2>
        <button onclick="testBackendValidation()">Test Backend Auth</button>
        <div id="validation-result"></div>
    </div>

    <div class="step">
        <h2>Step 5: WebSocket Auth</h2>
        <button onclick="testWebSocketAuth()">Test WebSocket</button>
        <div id="websocket-result"></div>
    </div>

    <div class="step">
        <h2>Debug Information</h2>
        <div id="debug-info" class="debug-info"></div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let debugLog = [];
        
        function log(level, message, data = null) {
            const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
            const entry = `[${timestamp}] ${level.padEnd(7)} ${message}`;
            debugLog.push(entry);
            if (data) {
                debugLog.push(`         ${JSON.stringify(data, null, 2)}`);
            }
            updateDebugInfo();
            console.log(entry, data || '');
        }

        function updateDebugInfo() {
            document.getElementById('debug-info').textContent = debugLog.slice(-20).join('\n');
        }

        function isTelegramWebView() {
            return !!(window.Telegram && window.Telegram.WebApp);
        }

        function getTelegramInitData() {
            if (!isTelegramWebView()) {
                return null;
            }
            
            const tg = window.Telegram.WebApp;
            
            // Primary source
            if (tg.initData) {
                log('INFO', 'Got initData from Telegram.WebApp.initData', { length: tg.initData.length });
                return tg.initData;
            }
            
            // Fallback: URL hash
            if (window.location.hash) {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const initData = hashParams.get('tgWebAppData');
                if (initData) {
                    log('INFO', 'Got initData from URL hash (fallback)');
                    return decodeURIComponent(initData);
                }
            }
            
            // Fallback: URL search params
            const urlParams = new URLSearchParams(window.location.search);
            const initDataParam = urlParams.get('tgWebAppStartParam');
            if (initDataParam) {
                log('INFO', 'Got initData from URL search params (fallback)');
                return decodeURIComponent(initDataParam);
            }
            
            log('WARN', 'No initData found in Telegram WebView');
            return null;
        }

        // Step 1: Environment Check
        function checkEnvironment() {
            const envInfo = {
                userAgent: navigator.userAgent,
                isTelegramWebView: isTelegramWebView(),
                telegramWebAppExists: !!(window.Telegram && window.Telegram.WebApp),
                telegramWebAppReady: false,
                hasInitData: false,
                initDataLength: 0,
                sessionStorageWorks: false,
                location: window.location.href
            };

            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                envInfo.telegramWebAppReady = typeof tg.ready === 'function';
                envInfo.hasInitData = !!tg.initData;
                envInfo.initDataLength = (tg.initData || '').length;
                envInfo.telegramVersion = tg.version;
                envInfo.telegramPlatform = tg.platform;
            }

            try {
                sessionStorage.setItem('test', 'test');
                sessionStorage.removeItem('test');
                envInfo.sessionStorageWorks = true;
            } catch (e) {
                envInfo.sessionStorageWorks = false;
            }

            log('INFO', 'Environment check completed', envInfo);

            const resultEl = document.getElementById('env-check');
            let status = 'success';
            let message = '✅ Environment OK';

            if (!envInfo.isTelegramWebView) {
                status = 'warning';
                message = '⚠️ Not in Telegram WebView (dev mode)';
            } else if (!envInfo.hasInitData) {
                status = 'error';
                message = '❌ In Telegram but no initData';
            }

            resultEl.className = status;
            resultEl.innerHTML = `
                <strong>${message}</strong>
                <pre>${JSON.stringify(envInfo, null, 2)}</pre>
            `;
        }

        // Step 2: Config Loading
        async function testConfigLoad() {
            const resultEl = document.getElementById('config-result');
            resultEl.innerHTML = '⏳ Loading config...';

            try {
                const response = await fetch('/api/validation-config');
                const config = await response.json();
                
                log('INFO', 'Config loaded successfully', config);
                
                resultEl.className = 'success';
                resultEl.innerHTML = `
                    <strong>✅ Config loaded</strong>
                    <pre>${JSON.stringify(config, null, 2)}</pre>
                `;
            } catch (e) {
                log('ERROR', 'Config load failed', { error: e.message });
                resultEl.className = 'error';
                resultEl.innerHTML = `<strong>❌ Config load failed:</strong> ${e.message}`;
            }
        }

        // Step 3: InitData Test
        function testInitData() {
            const resultEl = document.getElementById('initdata-result');
            
            const initData = getTelegramInitData();
            
            if (initData) {
                // Parse initData to show structure
                const params = new URLSearchParams(initData);
                const parsed = {};
                for (const [key, value] of params) {
                    if (key === 'user') {
                        try {
                            parsed[key] = JSON.parse(value);
                        } catch {
                            parsed[key] = value;
                        }
                    } else {
                        parsed[key] = value;
                    }
                }

                resultEl.className = 'success';
                resultEl.innerHTML = `
                    <strong>✅ InitData extracted</strong>
                    <p>Length: ${initData.length} chars</p>
                    <pre>${JSON.stringify(parsed, null, 2)}</pre>
                `;
                
                // Save for later tests
                sessionStorage.setItem('test_init_data', initData);
            } else {
                resultEl.className = 'error';
                resultEl.innerHTML = `<strong>❌ No initData found</strong>`;
            }
        }

        // Step 4: Backend Validation
        async function testBackendValidation() {
            const resultEl = document.getElementById('validation-result');
            resultEl.innerHTML = '⏳ Testing backend validation...';

            const initData = sessionStorage.getItem('test_init_data') || '';

            try {
                const response = await fetch('/api/validate-init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: initData })
                });

                const result = await response.json();
                
                log('INFO', 'Backend validation response', { 
                    status: response.status, 
                    result: { ...result, access_token: result.access_token ? '[PRESENT]' : '[MISSING]' }
                });

                if (response.ok && result.valid) {
                    resultEl.className = 'success';
                    resultEl.innerHTML = `
                        <strong>✅ Backend validation successful</strong>
                        <p>User: ${result.user?.first_name || 'Unknown'} (ID: ${result.user?.id})</p>
                        <p>Access token: ${result.access_token ? '✅ Present' : '❌ Missing'}</p>
                        <p>Refresh token: ${result.refresh_token ? '✅ Present' : '❌ Missing'}</p>
                    `;
                    
                    // Save tokens for WebSocket test
                    if (result.access_token) {
                        sessionStorage.setItem('test_access_token', result.access_token);
                    }
                } else {
                    resultEl.className = 'error';
                    resultEl.innerHTML = `
                        <strong>❌ Backend validation failed</strong>
                        <p>Status: ${response.status}</p>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (e) {
                log('ERROR', 'Backend validation error', { error: e.message });
                resultEl.className = 'error';
                resultEl.innerHTML = `<strong>❌ Request failed:</strong> ${e.message}`;
            }
        }

        // Step 5: WebSocket Test
        function testWebSocketAuth() {
            const resultEl = document.getElementById('websocket-result');
            resultEl.innerHTML = '⏳ Testing WebSocket connection...';

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            log('INFO', 'Connecting to WebSocket', { url: wsUrl });

            const ws = new WebSocket(wsUrl);
            let authSent = false;
            
            const timeout = setTimeout(() => {
                ws.close();
                resultEl.className = 'error';
                resultEl.innerHTML = '<strong>❌ WebSocket timeout</strong>';
                log('ERROR', 'WebSocket connection timeout');
            }, 10000);

            ws.onopen = () => {
                log('INFO', 'WebSocket connected, sending auth...');
                
                // Try JWT first, then initData
                const accessToken = sessionStorage.getItem('test_access_token');
                const initData = sessionStorage.getItem('test_init_data');

                if (accessToken) {
                    ws.send(JSON.stringify({ type: 'auth', token: accessToken }));
                    authSent = 'JWT';
                } else if (initData) {
                    ws.send(JSON.stringify({ type: 'auth', init_data: initData }));
                    authSent = 'initData';
                } else {
                    ws.send(JSON.stringify({ type: 'auth' }));
                    authSent = 'empty';
                }
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    log('INFO', 'WebSocket message received', data);

                    if (data.type === 'auth_ok') {
                        clearTimeout(timeout);
                        resultEl.className = 'success';
                        resultEl.innerHTML = `
                            <strong>✅ WebSocket auth successful</strong>
                            <p>Auth method: ${authSent}</p>
                        `;
                        ws.close();
                    } else if (data.type === 'error') {
                        clearTimeout(timeout);
                        resultEl.className = 'error';
                        resultEl.innerHTML = `
                            <strong>❌ WebSocket auth failed</strong>
                            <p>Error: ${data.message}</p>
                            <p>Auth method tried: ${authSent}</p>
                        `;
                        ws.close();
                    }
                } catch (e) {
                    log('ERROR', 'WebSocket message parse error', { error: e.message, data: event.data });
                }
            };

            ws.onerror = (error) => {
                clearTimeout(timeout);
                log('ERROR', 'WebSocket error', error);
                resultEl.className = 'error';
                resultEl.innerHTML = '<strong>❌ WebSocket connection error</strong>';
            };

            ws.onclose = (event) => {
                log('INFO', 'WebSocket closed', { code: event.code, reason: event.reason });
            };
        }

        // Initialize
        window.addEventListener('load', () => {
            checkEnvironment();
            
            // Auto-run tests if in Telegram
            if (isTelegramWebView()) {
                setTimeout(() => {
                    testConfigLoad();
                    setTimeout(() => {
                        testInitData();
                        setTimeout(() => {
                            testBackendValidation();
                        }, 1000);
                    }, 1000);
                }, 1000);
            }
        });
    </script>
</body>
</html>
