<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Main body (high-roof minibus, side view, front on right) -->
  <rect x="5" y="32" width="90" height="40" rx="4" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  <!-- Roof (slightly rounded) -->
  <rect x="9" y="20" width="72" height="16" rx="6" fill="#388E3C" stroke="#1B5E20" stroke-width="1.5"/>
  <!-- Front cab slope (windshield area) -->
  <path d="M81 20 L94 30 L94 48 L81 48 Z" fill="#388E3C" stroke="#1B5E20" stroke-width="1.5"/>
  <!-- Front windshield glass -->
  <path d="M82 22 L92 31 L92 46 L82 46 Z" fill="#B3E5FC" stroke="#0288D1" stroke-width="1"/>

  <!-- 4 side passenger windows -->
  <rect x="10" y="35" width="14" height="12" rx="2" fill="#B3E5FC" stroke="#0288D1" stroke-width="1.5"/>
  <rect x="27" y="35" width="14" height="12" rx="2" fill="#B3E5FC" stroke="#0288D1" stroke-width="1.5"/>
  <rect x="44" y="35" width="14" height="12" rx="2" fill="#B3E5FC" stroke="#0288D1" stroke-width="1.5"/>
  <rect x="61" y="35" width="14" height="12" rx="2" fill="#B3E5FC" stroke="#0288D1" stroke-width="1.5"/>

  <!-- Sliding door vertical line -->
  <line x1="26" y1="32" x2="26" y2="72" stroke="#2E7D32" stroke-width="1.5"/>

  <!-- Front headlight -->
  <rect x="91" y="44" width="5" height="6" rx="1.5" fill="#FFFDE7" stroke="#F9A825" stroke-width="1"/>
  <!-- Rear tail light -->
  <rect x="4" y="44" width="5" height="6" rx="1.5" fill="#EF9A9A" stroke="#C62828" stroke-width="1"/>
  <!-- Front step bumper -->
  <rect x="88" y="62" width="8" height="7" rx="2" fill="#1B5E20" stroke="#0A3E10" stroke-width="1"/>
  <!-- Underside stripe -->
  <rect x="5" y="70" width="90" height="5" rx="2" fill="#2E7D32"/>

  <!-- Rear wheel (dual) -->
  <circle cx="21" cy="82" r="11" fill="#212121" stroke="#424242" stroke-width="1.5"/>
  <circle cx="21" cy="82" r="6" fill="#616161"/>
  <circle cx="21" cy="82" r="2.5" fill="#BDBDBD"/>
  <!-- Front wheel -->
  <circle cx="76" cy="82" r="11" fill="#212121" stroke="#424242" stroke-width="1.5"/>
  <circle cx="76" cy="82" r="6" fill="#616161"/>
  <circle cx="76" cy="82" r="2.5" fill="#BDBDBD"/>
</svg>
