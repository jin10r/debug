<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Mounting bracket -->
  <rect x="38" y="72" width="24" height="8" rx="2" fill="#9E9E9E" stroke="#757575" stroke-width="1.5"/>
  <rect x="44" y="78" width="12" height="6" rx="1.5" fill="#757575"/>
  <!-- Main siren bar body -->
  <rect x="5" y="28" width="90" height="44" rx="8" fill="#BDBDBD" stroke="#9E9E9E" stroke-width="2"/>
  <!-- Red dome (left) -->
  <ellipse cx="26" cy="50" rx="17" ry="16" fill="#E53935" stroke="#B71C1C" stroke-width="1.5"/>
  <ellipse cx="26" cy="50" rx="11" ry="10" fill="#FF5252"/>
  <!-- Red glow highlight -->
  <ellipse cx="23" cy="44" rx="5" ry="3.5" fill="white" opacity="0.45"/>
  <!-- Blue dome (right) -->
  <ellipse cx="74" cy="50" rx="17" ry="16" fill="#1E88E5" stroke="#0D47A1" stroke-width="1.5"/>
  <ellipse cx="74" cy="50" rx="11" ry="10" fill="#448AFF"/>
  <!-- Blue glow highlight -->
  <ellipse cx="71" cy="44" rx="5" ry="3.5" fill="white" opacity="0.45"/>
  <!-- Center grey divider -->
  <rect x="43" y="28" width="14" height="44" fill="#9E9E9E" stroke="#757575" stroke-width="1"/>
  <!-- Grille slits -->
  <line x1="47" y1="33" x2="47" y2="67" stroke="#616161" stroke-width="1.5"/>
  <line x1="50" y1="33" x2="50" y2="67" stroke="#757575" stroke-width="1"/>
  <line x1="53" y1="33" x2="53" y2="67" stroke="#616161" stroke-width="1.5"/>
  <!-- Amber middle lens hint -->
  <ellipse cx="50" cy="50" rx="4" ry="5" fill="#FF8F00" stroke="#E65100" stroke-width="1"/>
</svg>
