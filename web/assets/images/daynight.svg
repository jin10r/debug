<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" opacity="0.85">
  <!-- Brightness / sun icon (display brightness style) -->
  <!-- 8 rays evenly spaced at 45° intervals -->
  <line x1="50" y1="8"  x2="50" y2="22" stroke="#FFD600" stroke-width="5" stroke-linecap="round"/>
  <line x1="50" y1="78" x2="50" y2="92" stroke="#FFD600" stroke-width="5" stroke-linecap="round"/>
  <line x1="8"  y1="50" x2="22" y2="50" stroke="#FFD600" stroke-width="5" stroke-linecap="round"/>
  <line x1="78" y1="50" x2="92" y2="50" stroke="#FFD600" stroke-width="5" stroke-linecap="round"/>
  <!-- Diagonal rays -->
  <line x1="20" y1="20" x2="30" y2="30" stroke="#FFD600" stroke-width="5" stroke-linecap="round"/>
  <line x1="70" y1="70" x2="80" y2="80" stroke="#FFD600" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="20" x2="70" y2="30" stroke="#FFD600" stroke-width="5" stroke-linecap="round"/>
  <line x1="20" y1="80" x2="30" y2="70" stroke="#FFD600" stroke-width="5" stroke-linecap="round"/>
  <!-- Center circle -->
  <circle cx="50" cy="50" r="20" fill="#FFD600"/>
</svg>
