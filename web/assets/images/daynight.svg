<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" opacity="0.75">
  <defs>
    <clipPath id="day-half">
      <polygon points="0,0 100,0 0,100"/>
    </clipPath>
    <clipPath id="night-half">
      <polygon points="100,0 100,100 0,100"/>
    </clipPath>
    <clipPath id="circle">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>

  <!-- Day half background (top-left) -->
  <circle cx="50" cy="50" r="48" fill="#FFF8E1" clip-path="url(#day-half)"/>

  <!-- Night half background (bottom-right) -->
  <circle cx="50" cy="50" r="48" fill="#1A237E" clip-path="url(#night-half)"/>

  <!-- Sun (day side) -->
  <circle cx="30" cy="28" r="11" fill="#FFD600" clip-path="url(#day-half)"/>
  <!-- Sun rays -->
  <line x1="30" y1="11" x2="30" y2="5"  stroke="#FFB300" stroke-width="3" stroke-linecap="round" clip-path="url(#day-half)"/>
  <line x1="30" y1="45" x2="30" y2="51" stroke="#FFB300" stroke-width="3" stroke-linecap="round" clip-path="url(#day-half)"/>
  <line x1="13" y1="28" x2="7"  y2="28" stroke="#FFB300" stroke-width="3" stroke-linecap="round" clip-path="url(#day-half)"/>
  <line x1="47" y1="28" x2="53" y2="28" stroke="#FFB300" stroke-width="3" stroke-linecap="round" clip-path="url(#day-half)"/>
  <line x1="19" y1="17" x2="14" y2="12" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round" clip-path="url(#day-half)"/>
  <line x1="41" y1="17" x2="46" y2="12" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round" clip-path="url(#day-half)"/>
  <line x1="19" y1="39" x2="14" y2="44" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round" clip-path="url(#day-half)"/>

  <!-- Moon + stars (night side) -->
  <path d="M72 56 A18 18 0 1 1 72 92 A13 13 0 1 0 72 56" fill="#B0BEC5" clip-path="url(#night-half)"/>
  <!-- Stars -->
  <circle cx="62" cy="64" r="2" fill="#E3F2FD" clip-path="url(#night-half)"/>
  <circle cx="88" cy="72" r="1.5" fill="#E3F2FD" clip-path="url(#night-half)"/>
  <circle cx="78" cy="58" r="1.5" fill="#E3F2FD" clip-path="url(#night-half)"/>

  <!-- Diagonal divider line -->
  <line x1="100" y1="0" x2="0" y2="100" stroke="#27343f" stroke-width="2" clip-path="url(#circle)"/>

  <!-- Outer border -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#27343f" stroke-width="2"/>
</svg>
