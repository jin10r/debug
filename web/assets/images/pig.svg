<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Head (behind helmet) -->
  <circle cx="50" cy="63" r="33" fill="#5BB85A" stroke="#388E3C" stroke-width="2"/>

  <!-- Helmet dome (M1-style, sits on top) -->
  <ellipse cx="50" cy="46" rx="35" ry="25" fill="#7D8C7D" stroke="#556055" stroke-width="1.5"/>
  <ellipse cx="40" cy="37" rx="11" ry="6" fill="#9EAD9E" opacity="0.45"/>
  <!-- Helmet rim ridge -->
  <ellipse cx="50" cy="69" rx="37" ry="5" fill="#667766" stroke="#445544" stroke-width="1"/>

  <!-- Chin straps -->
  <path d="M14 68 Q9 76 16 86" fill="none" stroke="#8B6234" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M86 68 Q91 76 84 86" fill="none" stroke="#8B6234" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Left buckle -->
  <rect x="11" y="83" width="11" height="8" rx="1.5" fill="#A0854A" stroke="#5A4020" stroke-width="1"/>
  <rect x="13" y="85" width="7" height="4" rx="0.5" fill="none" stroke="#5A4020" stroke-width="1.2"/>
  <!-- Right buckle -->
  <rect x="78" y="83" width="11" height="8" rx="1.5" fill="#A0854A" stroke="#5A4020" stroke-width="1"/>
  <rect x="80" y="85" width="7" height="4" rx="0.5" fill="none" stroke="#5A4020" stroke-width="1.2"/>

  <!-- Left eye -->
  <circle cx="35" cy="60" r="12" fill="white" stroke="#2A6A2A" stroke-width="1.5"/>
  <circle cx="37" cy="61" r="7" fill="#1A237E"/>
  <circle cx="40" cy="57" r="2.5" fill="white"/>
  <!-- Right eye -->
  <circle cx="65" cy="60" r="12" fill="white" stroke="#2A6A2A" stroke-width="1.5"/>
  <circle cx="67" cy="61" r="7" fill="#1A237E"/>
  <circle cx="70" cy="57" r="2.5" fill="white"/>

  <!-- Snout -->
  <ellipse cx="50" cy="79" rx="15" ry="10" fill="#7ED07D" stroke="#388E3C" stroke-width="1.5"/>
  <!-- Nostrils -->
  <ellipse cx="44" cy="80" rx="3.5" ry="3" fill="#2E7D32"/>
  <ellipse cx="56" cy="80" rx="3.5" ry="3" fill="#2E7D32"/>

  <!-- Smile -->
  <path d="M36 90 Q50 98 64 90" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Buck teeth -->
  <rect x="43" y="89" width="6" height="6" rx="1" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="51" y="89" width="6" height="6" rx="1" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
</svg>
