<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Military helmet dome -->
  <ellipse cx="50" cy="28" rx="32" ry="20" fill="#78909C" stroke="#455A64" stroke-width="2"/>
  <!-- Helmet brim -->
  <rect x="16" y="28" width="68" height="9" rx="4" fill="#546E7A" stroke="#37474F" stroke-width="1.5"/>
  <!-- Strap buckle left -->
  <rect x="14" y="60" width="8" height="6" rx="1.5" fill="#5D4037" stroke="#3E2723" stroke-width="1"/>
  <!-- Strap buckle right -->
  <rect x="78" y="60" width="8" height="6" rx="1.5" fill="#5D4037" stroke="#3E2723" stroke-width="1"/>
  <!-- Strap lines -->
  <path d="M16 37 Q10 52 16 63" fill="none" stroke="#795548" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M84 37 Q90 52 84 63" fill="none" stroke="#795548" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="16" cy="54" rx="7" ry="9" fill="#66BB6A" stroke="#388E3C" stroke-width="2"/>
  <ellipse cx="84" cy="54" rx="7" ry="9" fill="#66BB6A" stroke="#388E3C" stroke-width="2"/>
  <!-- Head -->
  <ellipse cx="50" cy="62" rx="36" ry="32" fill="#66BB6A" stroke="#388E3C" stroke-width="2.5"/>
  <!-- Eye whites -->
  <circle cx="37" cy="56" r="11" fill="white" stroke="#388E3C" stroke-width="1.5"/>
  <circle cx="63" cy="56" r="11" fill="white" stroke="#388E3C" stroke-width="1.5"/>
  <!-- Pupils -->
  <circle cx="37" cy="57" r="6" fill="#1A237E"/>
  <circle cx="63" cy="57" r="6" fill="#1A237E"/>
  <!-- Eye shine -->
  <circle cx="39" cy="54" r="2.5" fill="white"/>
  <circle cx="65" cy="54" r="2.5" fill="white"/>
  <!-- Snout -->
  <ellipse cx="50" cy="74" rx="14" ry="9" fill="#81C784" stroke="#388E3C" stroke-width="1.5"/>
  <!-- Nostrils -->
  <circle cx="44" cy="75" r="3" fill="#2E7D32"/>
  <circle cx="56" cy="75" r="3" fill="#2E7D32"/>
  <!-- Smile -->
  <path d="M34 87 Q50 98 66 87" fill="none" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
</svg>
