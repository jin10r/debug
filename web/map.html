<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" id="theme-color-meta">
    <meta name="color-scheme" content="light dark">
    <title>survival_map</title>

    <!-- Icons + PWA manifest -->
    <link rel="icon" href="data:,">
    <link rel="apple-touch-icon" href="/assets/images/pig.png">
    <link rel="manifest" href="/manifest.webmanifest">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/assets/lib/leaflet.css"/>
    <link rel="stylesheet" href="/assets/lib/MarkerCluster.css" />
    <link rel="stylesheet" href="/assets/lib/MarkerCluster.Default.css" />
    <link href="/assets/lib/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css">

    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Synchronous setup: auth headers, default config, user info -->
    <script>
      // JWT auth headers for API requests.
      window.getAuthHeaders = function() {
        const headers = { 'Content-Type': 'application/json' };
        const token = sessionStorage.getItem('access_token');
        if (token) {
          headers['Authorization'] = 'Bearer ' + token;
        }
        return headers;
      };

      // Default config — overridden by /api/config once the session is confirmed.
      window.APP_CONFIG = {
        map_center_lat: 46.4825,
        map_center_lng: 30.7233,
        map_default_zoom: 12,
        enable_random_points: true
      };

      // User info from sessionStorage.
      try {
        const userData = sessionStorage.getItem('user');
        if (userData) {
          const user = JSON.parse(userData);
          window.currentUserId = user.id;
          window.currentUserName = user.first_name || user.username;
        }
      } catch (e) {
        console.error('Failed to parse user data:', e);
      }
      if (sessionStorage.getItem('dev_mode') === 'true') {
        window.currentUserId = window.currentUserId || 'dev_user';
        window.currentUserName = window.currentUserName || 'Dev User';
      }
      window.isAdmin = false;

      // Online/offline status indicator.
      window.addEventListener('online', () => {
        if (window.updateOnlineStatus) window.updateOnlineStatus(true);
      });
      window.addEventListener('offline', () => {
        if (window.updateOnlineStatus) window.updateOnlineStatus(false);
      });
    </script>

</head>
<body>
    <div id="map"></div>
    <div id="errorMessage">Ошибка: Не удалось загрузить данные.</div>
    <div id="centerPopupOverlay"></div>
    <div id="centerPopup">
        <span class="close-btn" id="closeCenterPopup">×</span>
        <div id="centerPopupContent"></div>
    </div>

    <!-- Connection status indicator -->
    <div id="connection-indicator" style="display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #f44336; color: white; padding: 8px 16px; border-radius: 4px; z-index: 1000; font-size: 14px;">
        ⚠️ Нет связи с сервером
    </div>


    <div id="legendBtn" title="Легенда" style="position: absolute; top: 20px; right: 20px; z-index: 1000; cursor: pointer;">
        <img src="/assets/images/legend-info.svg" class="interaction-icon" style="width: 24px; height: 24px;" alt="Легенда">
    </div>

    <div id="dayNightBtn" title="День/Ночь" style="position: absolute; top: 50px; right: 20px; z-index: 1000; cursor: pointer;">
        <img id="dayNightIcon" src="/assets/images/daynight.svg" class="interaction-icon" style="width: 24px; height: 24px;" alt="День/Ночь">
    </div>

    <div id="controlsContainer">
        <div id="controlsSlider">
            <!-- Первый слайд: Время и Слои (объединенные) -->
            <div id="realtimeControls" class="controlPanel">
                <div class="centered-content">
                    <p>Отображать события за:</p>
                    <div class="buttons">
                        <button data-minutes="15">15 минут</button>
                        <button data-minutes="30">30 минут</button>
                        <button data-minutes="60">1 час</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/lib/leaflet.js"></script>
    <script src="/assets/lib/leaflet.markercluster.js"></script>
    <script src="/assets/lib/maplibre-gl.js"></script>
    <script src="/assets/lib/maplibre-gl-leaflet.js"></script>

    <!-- Hard validation gate + bootstrap -->
    <script>
      (async function() {
        // ====================================================================
        // Rule 2 — hard validation gate.
        // No frontend component (/dist/js/*) is injected until the backend
        // confirms a valid session. An invalid session bounces to the gate
        // page (/index.html), which redirects to REDIRECT_URL.
        // ====================================================================

        const token = sessionStorage.getItem('access_token');
        const devMode = sessionStorage.getItem('dev_mode') === 'true';

        // No credentials at all → back to the validation gate page.
        if (!token && !devMode) {
          window.location.replace('/index.html');
          return;
        }

        // Confirm the session with the backend before loading any component.
        // Returns true to proceed, false when redirecting/reloading.
        async function confirmSession() {
          let response;
          try {
            response = await fetch('/api/config', {
              method: 'POST',
              headers: window.getAuthHeaders(),
              body: JSON.stringify({})
            });
          } catch (err) {
            // Network error → offline. PWA rule 1: trust the prior session and
            // run from the service-worker shell + localStorage cache.
            console.warn('[GATE] Offline — proceeding from cache:', err);
            return true;
          }

          if (response.status === 401) {
            // Token expired/invalid — a single refresh attempt.
            const refreshToken = sessionStorage.getItem('refresh_token');
            if (refreshToken) {
              try {
                const r = await fetch('/api/auth/refresh', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ refresh_token: refreshToken })
                });
                if (r.ok) {
                  const d = await r.json();
                  sessionStorage.setItem('access_token', d.access_token);
                  location.reload();
                  return false;
                }
              } catch (e) {
                console.error('[GATE] Refresh failed:', e);
              }
            }
            // Invalid session → gate page handles REDIRECT_URL.
            window.location.replace('/index.html');
            return false;
          }

          if (response.ok) {
            try {
              const serverConfig = await response.json();
              window.APP_CONFIG = { ...window.APP_CONFIG, ...serverConfig };
              console.log('[GATE] Session confirmed, config loaded');
            } catch (e) {
              console.warn('[GATE] Config parse failed, using defaults');
            }
            return true;
          }

          console.warn('[GATE] Unexpected /api/config status:', response.status);
          window.location.replace('/index.html');
          return false;
        }

        const sessionOk = await confirmSession();
        if (!sessionOk) return; // redirected or reloading — load nothing

        // ====================================================================
        // Session confirmed — load frontend components.
        // ====================================================================
        const loadScript = (src) => new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = () => resolve(true);
          s.onerror = () => reject(new Error('Failed to load ' + src));
          document.head.appendChild(s);
        });

        try {
          const fallbackV = String(Date.now());
          await loadScript(`/js/telegram/integration.js/__v__/${fallbackV}`);

          if (window.telegramIntegration) {
            window.telegramIntegration.init();
            window.telegramIntegration.on('onActivated', () => console.log('App activated'));
            window.telegramIntegration.on('onViewportChanged', (e) => console.log('Viewport changed:', e));
          }
          if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
          }

          const v = Date.now();
          await loadScript(`/dist/js/common.js?t=${v}`);
          await loadScript(`/dist/js/core/store.js?t=${v}`);
          await loadScript(`/dist/js/core/local_cache.js?t=${v}`);
          await loadScript(`/dist/js/core/websocket.js?t=${v}`);
          await loadScript(`/dist/js/core/event_manager.js?t=${v}`);
          await loadScript(`/dist/js/core/token-manager.js?t=${v}`);
          await loadScript(`/dist/js/core/map.js?t=${v}`);
          await loadScript(`/dist/js/core/data.js?t=${v}`);
          await loadScript(`/dist/js/modules/popups.js?t=${v}`);
          await loadScript(`/dist/js/modules/notifications.js?t=${v}`);
          await loadScript(`/dist/js/core/ui.js?t=${v}`);

          console.log('✅ All components loaded');

          if (window.tokenManager) {
            await window.tokenManager.init();
          }
          if (window.bootstrapUI) {
            window.bootstrapUI();
          } else {
            console.error('❌ bootstrapUI not found');
          }
        } catch (error) {
          console.error('❌ Failed to load app:', error);
          const msg = 'Ошибка загрузки приложения. ' +
            'Пожалуйста, закройте и заново откройте мини‑приложение.';
          if (window.telegramIntegration?.showAlert) {
            try { await window.telegramIntegration.showAlert(msg); } catch (e) { alert(msg); }
          } else if (window.Telegram?.WebApp?.showAlert) {
            try { await window.Telegram.WebApp.showAlert(msg); } catch (e) { alert(msg); }
          } else {
            alert(msg);
          }
        }

        // Register the service worker (PWA rule 1) after boot so it never
        // delays first paint.
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js').catch((e) => {
            console.warn('[SW] registration failed:', e);
          });
        }
      })();
    </script>
</body>
</html>
